services:
  # Web Service
  - type: web
    name: employee-task-api
    runtime: python
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app --workers 2 --worker-class sync --timeout 120 --graceful-timeout 30 --log-level info --access-logfile - --error-logfile -"
    healthCheckPath: /health
    envVars:
      - key: FLASK_APP
        value: wsgi:app
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: employee-task-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.13.7
    autoDeploy: true

# Database
databases:
  - name: employee-task-db
    databaseName: employee_task_api
    plan: free
    region: oregon
