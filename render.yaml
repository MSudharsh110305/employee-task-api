services:
  # Web Service
  - type: web
    name: employee-task-api
    runtime: python
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app --workers 4 --timeout 120"
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: employee-task-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
    autoDeploy: true

# Database
databases:
  - name: employee-task-db
    databaseName: employee_task_api
    plan: free
    region: oregon
